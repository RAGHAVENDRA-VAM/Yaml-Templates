---
# global-ci-template.yml
# Purpose: Universal CI template structure for all CI/CD tools and languages.
# This file defines the mandatory structure that ALL CI pipelines must follow.

# YAML Coding Standards (MANDATORY)
yaml_standards:
  document_start: "---"
  encoding: "UTF-8"
  indentation: 2  # spaces only, no tabs
  naming_convention: "snake_case"
  line_length: 120
  comments: "required for all major sections"

# Universal CI Pipeline Structure (NEVER CHANGE THIS ORDER)
ci_pipeline_structure:
  
  # Stage 1: Build (MANDATORY)
  stage_build:
    name: "Build"
    purpose: "Compile source code, restore dependencies, create deployment package"
    steps:
      - "checkout_code"
      - "install_language_sdk"
      - "restore_dependencies"
      - "compile_application"
      - "create_deployment_package"
    
  # Stage 2: SAST (MANDATORY - NEVER SKIP)
  stage_sast:
    name: "SAST"
    purpose: "Security scanning with mandatory tools"
    tools:
      gitleaks:
        command: "gitleaks detect --source . --verbose"
        purpose: "Secret and credential detection"
        continue_on_error: true
      semgrep:
        command: "semgrep scan --config auto"
        purpose: "Static code analysis"
        continue_on_error: true
      trivy:
        command: "trivy fs . --format table --severity HIGH,CRITICAL"
        purpose: "Dependency and filesystem vulnerability scan"
        continue_on_error: true
    steps:
      - "run_gitleaks_scan"
      - "run_semgrep_scan"
      - "run_trivy_scan"
    
  # Stage 3: Publish (MANDATORY)
  stage_publish:
    name: "Publish"
    purpose: "Publish build artifact for CD consumption"
    steps:
      - "create_final_artifact"
      - "publish_build_artifact"

# Language-Specific Requirements
language_requirements:
  
  dotnet:
    sdk_version: "8.x"
    build_commands:
      - "dotnet restore"
      - "dotnet build --configuration Release --no-restore"
      - "dotnet publish --configuration Release --no-build --output dist/"
    package_command: "zip -r app.zip dist/"
    
  node:
    version: "20.x"
    build_commands:
      - "npm ci"
      - "npm run build"
    package_command: "zip -r app.zip ."
    
  python:
    version: "3.12"
    build_commands:
      - "python -m pip install --upgrade pip"
      - "pip install -r requirements.txt"
    package_command: "zip -r app.zip ."
    
  java:
    version: "21"
    build_commands:
      - "mvn clean package -DskipTests --batch-mode"
    package_command: "cd target && zip -r ../app.zip *.jar"

# Universal Variables (ALL TOOLS MUST USE)
universal_variables:
  project_name: "auto-detect from repository"
  artifact_name: "{project_name}-drop"
  build_configuration: "Release"

# Mandatory Rules for AI Generation
ai_generation_rules:
  - "Always start with --- document marker"
  - "Always include file header comment with purpose"
  - "Use 2-space indentation, never tabs"
  - "Follow snake_case for all variable names"
  - "CI must have exactly 3 stages: Build → SAST → Publish"
  - "SAST must include all 3 tools: gitleaks, semgrep, trivy"
  - "Set continueOnError: true for all SAST tools"
  - "Use tool-specific syntax for each CI/CD platform"
  - "Include comments for each stage explaining its purpose"
  - "Generate tool-native YAML syntax"
  - "Keep pipelines simple and clean"
  - "No complex testing or health checks in CI"