---
# yaml-templates/github-actions/ci/python-ci.yml
# Purpose: GitHub Actions CI workflow for Python applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

name: "Python CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: "3.12"
  PROJECT_NAME: "${{ github.event.repository.name }}"
  ARTIFACT_NAME: "${{ github.event.repository.name }}-drop"

jobs:
  # Job 1: Build — Build Python application
  build:
    name: "Build Python Application"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: "Install Dependencies"
        run: "pip install -r requirements.txt"

      - name: "Build Package"
        run: >
          pip install build &&
          python -m build --outdir dist/

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "build-output"
          path: "dist/"

  # Job 2: Test — Run unit tests
  test:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: "Install Dependencies"
        run: "pip install -r requirements.txt"

      - name: "Run Unit Tests"
        run: "pytest --tb=short --junitxml=test-results.xml"

      - name: "Publish Test Results"
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Python Tests"
          path: "test-results.xml"
          reporter: "java-junit"

  # Job 3: SAST — Security scanning (mandatory)
  sast:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # Gitleaks — detect secrets and credentials
      - name: "Gitleaks — Secret Detection"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: true

      # Semgrep — static code analysis
      - name: "Semgrep — Code Analysis"
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"
        continue-on-error: true

      # Trivy — dependency and filesystem scan
      - name: "Trivy — Dependency & FS Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: "Upload SAST Reports"
        uses: actions/upload-artifact@v4
        with:
          name: "sast-reports"
          path: "*.sarif"
        if: always()

  # Job 4: Publish — Publish final artifact
  publish:
    name: "Publish Artifact"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "build-output"
          path: "dist/"

      - name: "Publish ${{ env.ARTIFACT_NAME }}"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: "dist/"