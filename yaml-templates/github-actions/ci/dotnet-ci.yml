---
# yaml-templates/github-actions/ci/dotnet-ci.yml
# Purpose: GitHub Actions CI workflow for .NET applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

name: ".NET CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: "8.x"
  BUILD_CONFIGURATION: "Release"
  PROJECT_NAME: "${{ github.event.repository.name }}"
  ARTIFACT_NAME: "${{ github.event.repository.name }}-drop"

jobs:
  # Job 1: Build — Compile .NET application
  build:
    name: "Build .NET Application"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}"

      - name: "Restore Dependencies"
        run: "dotnet restore"

      - name: "Build Application"
        run: "dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore"

      - name: "Publish Application"
        run: >
          dotnet publish --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build --output dist/

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "build-output"
          path: "dist/"

  # Job 2: Test — Run unit tests
  test:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}"

      - name: "Restore Dependencies"
        run: "dotnet restore"

      - name: "Run Unit Tests"
        run: >
          dotnet test --configuration ${{ env.BUILD_CONFIGURATION }}
          --logger trx --results-directory test-results/

      - name: "Publish Test Results"
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ".NET Tests"
          path: "test-results/*.trx"
          reporter: "dotnet-trx"

  # Job 3: SAST — Security scanning (mandatory)
  sast:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # Gitleaks — detect secrets and credentials
      - name: "Gitleaks — Secret Detection"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: true

      # Semgrep — static code analysis
      - name: "Semgrep — Code Analysis"
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"
        continue-on-error: true

      # Trivy — dependency and filesystem scan
      - name: "Trivy — Dependency & FS Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: "Upload SAST Reports"
        uses: actions/upload-artifact@v4
        with:
          name: "sast-reports"
          path: "*.sarif"
        if: always()

  # Job 4: Publish — Publish final artifact
  publish:
    name: "Publish Artifact"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "build-output"
          path: "dist/"

      - name: "Publish ${{ env.ARTIFACT_NAME }}"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: "dist/"