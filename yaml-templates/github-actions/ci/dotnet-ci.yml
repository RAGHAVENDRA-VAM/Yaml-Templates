---
# yaml-templates/github-actions/ci/dotnet-ci.yml
# Purpose: GitHub Actions CI workflow for .NET applications.
# Stages: Build → SAST → Publish

name: ".NET CI Pipeline"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.x"
  BUILD_CONFIGURATION: "Release"
  PROJECT_NAME: "${{ github.event.repository.name }}"

jobs:
  build:
    name: "Build .NET App"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup .NET SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "${{ env.DOTNET_VERSION }}"

      - name: "Restore Dependencies"
        run: "dotnet restore"

      - name: "Build Application"
        run: "dotnet build --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore"

      - name: "Publish Application"
        run: "dotnet publish --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output dist/"

      - name: "Archive Application"
        run: |
          cd dist
          zip -r ../app.zip .

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "dotnet-app"
          path: "app.zip"

  sast:
    name: "Security Scan (SAST)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Run Semgrep"
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"

      - name: "Run Gitleaks"
        run: |
          docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect \
            --source="/path" \
            --verbose \
            --redact

      - name: "Run Trivy FS Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"