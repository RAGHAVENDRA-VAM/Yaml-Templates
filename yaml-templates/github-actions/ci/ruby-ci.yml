---
# yaml-templates/github-actions/ci/ruby-ci.yml
# Purpose: GitHub Actions CI workflow for Ruby applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

name: "Ruby CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  RUBY_VERSION: "3.2"
  PROJECT_NAME: "${{ github.event.repository.name }}"
  ARTIFACT_NAME: "${{ github.event.repository.name }}-drop"

jobs:
  build:
    name: "Build Ruby Application"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ env.RUBY_VERSION }}"
          bundler-cache: true

      - name: "Install Dependencies"
        run: "bundle install --jobs 4 --retry 3"

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "build-output"
          path: "./"
          exclude: |
            .git
            spec
            test
            .github

  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Ruby"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "${{ env.RUBY_VERSION }}"
          bundler-cache: true

      - name: "Install Dependencies"
        run: "bundle install"

      - name: "Run RSpec Tests"
        run: "bundle exec rspec --format RspecJunitFormatter --out rspec.xml"

      - name: "Run RuboCop"
        run: "bundle exec rubocop"

      - name: "Publish Test Results"
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Ruby Tests"
          path: "rspec.xml"
          reporter: "java-junit"

  sast:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Gitleaks — Secret Detection"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Semgrep — Code Analysis"
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"

      - name: "Trivy — Dependency Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."

  publish:
    name: "Publish Artifact"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "build-output"
          path: "./"

      - name: "Publish ${{ env.ARTIFACT_NAME }}"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: "./"