---
# yaml-templates/github-actions/ci/node-ci.yml
# Purpose: GitHub Actions CI workflow for Node.js applications.
# Stages: Build → SAST → Publish

name: "Node.js CI Pipeline"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"
  PROJECT_NAME: "${{ github.event.repository.name }}"

jobs:
  build:
    name: "Build Node.js App"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: "npm"

      - name: "Install Dependencies"
        run: "npm ci"

      - name: "Build Application"
        run: "npm run build"

      - name: "Archive Application"
        run: |
          zip -r app.zip .

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "node-app"
          path: "app.zip"

  sast:
    name: "Security Scan (SAST)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Run Semgrep"
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"

      - name: "Run Gitleaks"
        run: |
          docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect \
            --source="/path" \
            --verbose \
            --redact

      - name: "Run Trivy FS Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"