---
# yaml-templates/github-actions/ci/rust-ci.yml
# Purpose: GitHub Actions CI workflow for Rust applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

name: "Rust CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  RUST_VERSION: "stable"
  PROJECT_NAME: "${{ github.event.repository.name }}"
  ARTIFACT_NAME: "${{ github.event.repository.name }}-drop"

jobs:
  build:
    name: "Build Rust Application"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          override: true
          components: rustfmt, clippy

      - name: "Cache Cargo"
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: "Build Application"
        run: "cargo build --release"

      - name: "Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "build-output"
          path: "target/release/"

  test:
    name: "Run Tests"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: actions-rs/toolchain@v1
        with:
          toolchain: "${{ env.RUST_VERSION }}"
          override: true

      - name: "Run Unit Tests"
        run: "cargo test --verbose"

      - name: "Run Clippy"
        run: "cargo clippy -- -D warnings"

      - name: "Check Formatting"
        run: "cargo fmt -- --check"

  sast:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Gitleaks — Secret Detection"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Semgrep — Code Analysis"
        uses: returntocorp/semgrep-action@v1
        with:
          config: "auto"

      - name: "Trivy — Dependency Scan"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."

  publish:
    name: "Publish Artifact"
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "build-output"
          path: "target/release/"

      - name: "Publish ${{ env.ARTIFACT_NAME }}"
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: "target/release/"