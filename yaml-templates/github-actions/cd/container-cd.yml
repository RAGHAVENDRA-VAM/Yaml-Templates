---
# yaml-templates/github-actions/cd/container-cd.yml
# Purpose: GitHub Actions CD workflow for deploying as Docker container.
# Stages: Deploy

name: "Container CD Pipeline"

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  PROJECT_NAME: "${{ github.event.repository.name }}"

jobs:
  deploy:
    name: "Deploy as Docker Container"
    runs-on: ubuntu-latest
    environment: "production"
    if: "${{ github.event.workflow_run.conclusion == 'success' }}"
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "app"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ github.event.workflow_run.id }}"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to Container Registry"
        uses: docker/login-action@v3
        with:
          registry: "${{ secrets.CONTAINER_REGISTRY }}"
          username: "${{ secrets.REGISTRY_USERNAME }}"
          password: "${{ secrets.REGISTRY_PASSWORD }}"

      - name: "Build and Push Docker Image"
        uses: docker/build-push-action@v5
        with:
          context: "."
          push: true
          tags: |
            ${{ secrets.CONTAINER_REGISTRY }}/${{ env.PROJECT_NAME }}:${{ github.run_id }}
            ${{ secrets.CONTAINER_REGISTRY }}/${{ env.PROJECT_NAME }}:latest