---
# yaml-templates/github-actions/cd/vm-cd.yml
# Purpose: GitHub Actions CD workflow for deploying to Virtual Machine via SSH.
# Jobs: Download → Deploy
# Target: VM with SSH copy, service restart, and health check

name: "VM CD Pipeline"

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  PROJECT_NAME: "${{ github.event.repository.name }}"
  ARTIFACT_NAME: "${{ github.event.repository.name }}-drop"
  ENVIRONMENT: "dev"

jobs:
  # Deploy job — deploy to VM
  deploy:
    name: "Deploy to Virtual Machine"
    runs-on: ubuntu-latest
    environment: "${{ env.ENVIRONMENT }}"
    if: "${{ github.event.workflow_run.conclusion == 'success' }}"
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # Download artifact from CI workflow
      - name: "Download ${{ env.ARTIFACT_NAME }}"
        uses: actions/download-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: "artifacts/"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ github.event.workflow_run.id }}"

      # Copy artifact to VM
      - name: "Copy Artifact to VM"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "${{ secrets.VM_HOST }}"
          username: "${{ secrets.VM_USERNAME }}"
          key: "${{ secrets.VM_SSH_KEY }}"
          source: "artifacts/"
          target: "/app/releases/${{ github.run_id }}/"

      # Deploy on VM
      - name: "Deploy Application on VM"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "${{ secrets.VM_HOST }}"
          username: "${{ secrets.VM_USERNAME }}"
          key: "${{ secrets.VM_SSH_KEY }}"
          script: |
            # Create backup of current version
            sudo cp -r /app/current /app/backup/$(date +%Y%m%d_%H%M%S) || true
            
            # Deploy new version
            cd /app/releases/${{ github.run_id }}
            sudo cp -r artifacts/* /app/current/
            
            # Set permissions
            sudo chown -R appuser:appuser /app/current
            sudo chmod +x /app/current/start.sh || true
            
            # Restart service
            sudo systemctl restart ${{ env.PROJECT_NAME }}

      # Verify service health
      - name: "Verify Service Health"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "${{ secrets.VM_HOST }}"
          username: "${{ secrets.VM_USERNAME }}"
          key: "${{ secrets.VM_SSH_KEY }}"
          script: |
            # Wait for service to start
            sleep 10
            
            # Check service status
            if systemctl is-active --quiet ${{ env.PROJECT_NAME }}; then
              echo "✅ Service ${{ env.PROJECT_NAME }} is running"
              systemctl status ${{ env.PROJECT_NAME }} --no-pager
            else
              echo "❌ Service ${{ env.PROJECT_NAME }} failed to start"
              systemctl status ${{ env.PROJECT_NAME }} --no-pager
              exit 1
            fi

      # HTTP health check
      - name: "HTTP Health Check"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "${{ secrets.VM_HOST }}"
          username: "${{ secrets.VM_USERNAME }}"
          key: "${{ secrets.VM_SSH_KEY }}"
          script: >
            curl --fail --silent --max-time 30 http://localhost:8080/health
            && echo "✅ HTTP health check passed"
            || echo "⚠️ HTTP health check failed"
        continue-on-error: true