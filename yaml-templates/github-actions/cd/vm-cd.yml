---
# yaml-templates/github-actions/cd/vm-cd.yml
# Purpose: GitHub Actions CD workflow for deploying to Virtual Machine.
# Stages: Deploy

name: "VM CD Pipeline"

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  PROJECT_NAME: "${{ github.event.repository.name }}"

jobs:
  deploy:
    name: "Deploy to Virtual Machine"
    runs-on: ubuntu-latest
    environment: "production"
    if: "${{ github.event.workflow_run.conclusion == 'success' }}"
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "app"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ github.event.workflow_run.id }}"

      - name: "Copy Artifact to VM"
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "${{ secrets.VM_HOST }}"
          username: "${{ secrets.VM_USERNAME }}"
          key: "${{ secrets.VM_SSH_KEY }}"
          source: "app.zip"
          target: "/app/releases/${{ github.run_id }}/"

      - name: "Deploy Application on VM"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "${{ secrets.VM_HOST }}"
          username: "${{ secrets.VM_USERNAME }}"
          key: "${{ secrets.VM_SSH_KEY }}"
          script: |
            cd /app/releases/${{ github.run_id }}
            unzip -o app.zip -d /app/current
            sudo systemctl restart ${{ env.PROJECT_NAME }}