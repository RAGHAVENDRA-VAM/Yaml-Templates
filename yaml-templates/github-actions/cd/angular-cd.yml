---
# yaml-templates/github-actions/cd/angular-cd.yml
# Purpose: GitHub Actions CD workflow for Angular applications.
# Stages: Download → Deploy → Verify
# Targets: Azure Static Web Apps, S3, or CDN

name: "Angular CD Pipeline"

on:
  workflow_run:
    workflows: ["Angular CI Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "my-angular-app"
  AZURE_WEBAPP_PACKAGE_PATH: "./dist"
  NODE_VERSION: "20.x"

jobs:
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-drop"
          path: "./dist"

      - name: "Deploy to Azure Static Web Apps"
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          action: "upload"
          app_location: "./dist"
          skip_app_build: true

      - name: "Verify Deployment"
        run: |
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurestaticapps.net || exit 1

  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-drop"
          path: "./dist"

      - name: "Deploy to Azure Static Web Apps"
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          action: "upload"
          app_location: "./dist"
          skip_app_build: true

      - name: "Verify Production Deployment"
        run: |
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurestaticapps.net || exit 1