---
# yaml-templates/github-actions/cd/php-cd.yml
# Purpose: GitHub Actions CD workflow for PHP applications.
# Stages: Download → Deploy → Verify
# Targets: Azure Web App, shared hosting, or VM

name: "PHP CD Pipeline"

on:
  workflow_run:
    workflows: ["PHP CI Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "my-php-app"
  AZURE_WEBAPP_PACKAGE_PATH: "./"
  PHP_VERSION: "8.2"

jobs:
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-drop"
          path: "./"

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v2
        with:
          app-name: "${{ env.AZURE_WEBAPP_NAME }}-staging"
          publish-profile: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}"
          package: "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: "Verify Deployment"
        run: |
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}-staging.azurewebsites.net || exit 1

  deploy-production:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "${{ github.event.repository.name }}-drop"
          path: "./"

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v2
        with:
          app-name: "${{ env.AZURE_WEBAPP_NAME }}"
          publish-profile: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          package: "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"

      - name: "Verify Production Deployment"
        run: |
          curl -f https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net || exit 1