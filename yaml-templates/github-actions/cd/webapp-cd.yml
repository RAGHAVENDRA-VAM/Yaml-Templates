---
# yaml-templates/github-actions/cd/webapp-cd.yml
# Purpose: GitHub Actions CD workflow for deploying to Azure Web App.
# Stages: Deploy

name: "Web App CD Pipeline"

on:
  workflow_run:
    workflows: ["Python CI Pipeline"]
    types:
      - completed
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: "${{ github.event.repository.name }}"

jobs:
  deploy:
    name: "Deploy to Azure Web App"
    runs-on: ubuntu-latest
    environment: "production"
    if: "${{ github.event.workflow_run.conclusion == 'success' }}"
    steps:
      - name: "Download Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "python-app"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          run-id: "${{ github.event.workflow_run.id }}"

      - name: "Deploy to Azure Web App"
        uses: azure/webapps-deploy@v3
        with:
          app-name: "${{ env.AZURE_WEBAPP_NAME }}"
          publish-profile: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
          package: "app.zip"