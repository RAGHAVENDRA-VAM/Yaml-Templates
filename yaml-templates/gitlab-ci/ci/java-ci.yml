---
# yaml-templates/gitlab-ci/ci/java-ci.yml
# Purpose: GitLab CI pipeline for Java applications.
# Stages: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

variables:
  JAVA_VERSION: "21"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  paths:
    - .m2/repository/

stages:
  - build
  - test
  - sast
  - publish

# Stage 1: Build — Build Java application
build_java:
  stage: build
  image: openjdk:21-jdk-slim
  before_script:
    - apt-get update && apt-get install -y maven
  script:
    - mvn clean package -DskipTests --batch-mode
  artifacts:
    paths:
      - target/
    expire_in: 1 hour

# Stage 2: Test — Run unit tests
test_java:
  stage: test
  image: openjdk:21-jdk-slim
  dependencies:
    - build_java
  before_script:
    - apt-get update && apt-get install -y maven
  script:
    - mvn test --batch-mode
  artifacts:
    reports:
      junit: "target/surefire-reports/TEST-*.xml"
    expire_in: 1 week

# Stage 3: SAST — Security scanning (mandatory)
sast_gitleaks:
  stage: sast
  image: zricethezav/gitleaks:latest
  script:
    - gitleaks detect --source . --verbose
  allow_failure: true

sast_semgrep:
  stage: sast
  image: returntocorp/semgrep:latest
  script:
    - semgrep scan --config auto --json --output semgrep-report.json
  artifacts:
    paths:
      - semgrep-report.json
    expire_in: 1 week
  allow_failure: true

sast_trivy:
  stage: sast
  image: aquasec/trivy:latest
  script:
    - trivy fs . --format json --output trivy-report.json
  artifacts:
    paths:
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

# Stage 4: Publish — Publish final artifact
publish_java:
  stage: publish
  image: openjdk:21-jdk-slim
  dependencies:
    - build_java
  script:
    - echo "Publishing $ARTIFACT_NAME"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - target/
    expire_in: 1 week
  only:
    - main
    - develop