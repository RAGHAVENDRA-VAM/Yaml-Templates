---
# GitLab CI Pipeline for Java Applications
# Follows Build -> SAST -> Publish structure with mandatory security scanning

stages:
  - build
  - sast
  - publish

variables:
  JAVA_VERSION: "17"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

build_stage:
  stage: build
  image: openjdk:17-jdk
  cache:
    paths:
      - .m2/repository/
  script:
    - ./mvnw clean compile
    - ./mvnw test
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/
      - .m2/repository/
    expire_in: 1 hour
  allow_failure: false

sast_stage:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm -v $CI_PROJECT_DIR:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - gitleaks-report.json
      - semgrep-report.json
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

publish_stage:
  stage: publish
  image: openjdk:17-jdk
  script:
    - ./mvnw package -DskipTests
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - target/*.jar
      - target/*.war
      - "*.yml"
      - "*.yaml"
    expire_in: 1 week
  dependencies:
    - build_stage