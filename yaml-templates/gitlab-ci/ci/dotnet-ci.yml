---
# GitLab CI Pipeline for .NET Applications
# Follows Build -> SAST -> Publish structure with mandatory security scanning

stages:
  - build
  - sast
  - publish

variables:
  DOTNET_VERSION: "8.0"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

build_stage:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore
    - dotnet build --configuration Release --no-restore
    - dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
  artifacts:
    reports:
      junit: coverage/**/coverage.cobertura.xml
    paths:
      - bin/
      - obj/
      - coverage/
    expire_in: 1 hour
  allow_failure: false

sast_stage:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm -v $CI_PROJECT_DIR:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - gitleaks-report.json
      - semgrep-report.json
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

publish_stage:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet publish --configuration Release --output ./publish --no-restore
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - publish/
      - "*.yml"
      - "*.yaml"
    expire_in: 1 week
  dependencies:
    - build_stage