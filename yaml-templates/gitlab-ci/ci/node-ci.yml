---
# GitLab CI Pipeline for Node.js Applications
# Follows Build -> SAST -> Publish structure with mandatory security scanning

stages:
  - build
  - sast
  - publish

variables:
  NODE_VERSION: "20"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

build_stage:
  stage: build
  image: node:20
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - npm test
  artifacts:
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - node_modules/
      - dist/
      - build/
      - coverage/
    expire_in: 1 hour
  allow_failure: false

sast_stage:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm -v $CI_PROJECT_DIR:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - gitleaks-report.json
      - semgrep-report.json
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

publish_stage:
  stage: publish
  image: node:20
  script:
    - echo "Publishing Node.js application artifacts"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - dist/
      - build/
      - package.json
      - package-lock.json
      - "*.yml"
      - "*.yaml"
    expire_in: 1 week
  dependencies:
    - build_stage