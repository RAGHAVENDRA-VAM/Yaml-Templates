---
# yaml-templates/gitlab-ci/ci/react-ci.yml
# Purpose: GitLab CI pipeline for React applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

variables:
  NODE_VERSION: "20"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

stages:
  - build
  - test
  - sast
  - publish

# Build Stage
build:
  stage: build
  image: node:$NODE_VERSION
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Test Stage
test:
  stage: test
  image: node:$NODE_VERSION
  dependencies:
    - build
  cache:
    paths:
      - node_modules/
  script:
    - npm ci
    - npm test -- --coverage --watchAll=false
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  only:
    - main
    - develop
    - merge_requests

# Security Scan Stage
sast:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - test
  script:
    # Gitleaks — Secret Detection
    - docker run --rm -v $PWD:/path zricethezav/gitleaks:latest detect --source="/path" --verbose || true
    # Semgrep — Code Analysis
    - docker run --rm -v $PWD:/src returntocorp/semgrep --config=auto /src || true
    # Trivy — Dependency Scan
    - docker run --rm -v $PWD:/workspace aquasec/trivy fs /workspace || true
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Publish Stage
publish:
  stage: publish
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Publishing $ARTIFACT_NAME"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - build/
    expire_in: 1 week
  only:
    - main
    - develop