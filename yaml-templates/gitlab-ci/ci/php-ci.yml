---
# yaml-templates/gitlab-ci/ci/php-ci.yml
# Purpose: GitLab CI pipeline for PHP applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

variables:
  PHP_VERSION: "8.2"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

stages:
  - build
  - test
  - sast
  - publish

# Build Stage
build:
  stage: build
  image: php:$PHP_VERSION
  cache:
    paths:
      - vendor/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl libmcrypt-dev libjpeg-dev libpng-dev libfreetype6-dev libbz2-dev
    - curl --silent --show-error https://getcomposer.org/installer | php
    - php composer.phar install --no-dev --optimize-autoloader
  script:
    - echo "Build completed"
  artifacts:
    paths:
      - ./
    exclude:
      - .git
      - tests
      - .gitlab-ci.yml
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Test Stage
test:
  stage: test
  image: php:$PHP_VERSION
  dependencies:
    - build
  cache:
    paths:
      - vendor/
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl libmcrypt-dev libjpeg-dev libpng-dev libfreetype6-dev libbz2-dev
    - curl --silent --show-error https://getcomposer.org/installer | php
    - php composer.phar install
  script:
    - vendor/bin/phpunit --coverage-clover=coverage.xml
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  only:
    - main
    - develop
    - merge_requests

# Security Scan Stage
sast:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - test
  script:
    # Gitleaks — Secret Detection
    - docker run --rm -v $PWD:/path zricethezav/gitleaks:latest detect --source="/path" --verbose || true
    # Semgrep — Code Analysis
    - docker run --rm -v $PWD:/src returntocorp/semgrep --config=auto /src || true
    # Trivy — Dependency Scan
    - docker run --rm -v $PWD:/workspace aquasec/trivy fs /workspace || true
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Publish Stage
publish:
  stage: publish
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Publishing $ARTIFACT_NAME"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - ./
    exclude:
      - .git
      - tests
    expire_in: 1 week
  only:
    - main
    - develop