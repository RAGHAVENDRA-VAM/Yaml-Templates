---
# GitLab CI Pipeline for Python Applications
# Follows Build -> SAST -> Publish structure with mandatory security scanning

stages:
  - build
  - sast
  - publish

variables:
  PYTHON_VERSION: "3.11"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

build_stage:
  stage: build
  image: python:3.11
  cache:
    paths:
      - .cache/pip/
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - python -m pytest tests/ --junitxml=test-results.xml --cov=. --cov-report=xml
  artifacts:
    reports:
      junit: test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - "*.py"
      - requirements.txt
      - coverage.xml
    expire_in: 1 hour
  allow_failure: false

sast_stage:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker run --rm -v $CI_PROJECT_DIR:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true
    - docker run --rm -v $CI_PROJECT_DIR:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true
  artifacts:
    reports:
      sast: semgrep-report.json
    paths:
      - gitleaks-report.json
      - semgrep-report.json
      - trivy-report.json
    expire_in: 1 week
  allow_failure: true

publish_stage:
  stage: publish
  image: python:3.11
  script:
    - echo "Publishing Python application artifacts"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - "*.py"
      - requirements.txt
      - "*.yml"
      - "*.yaml"
    expire_in: 1 week
  dependencies:
    - build_stage