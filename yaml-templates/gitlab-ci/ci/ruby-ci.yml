---
# yaml-templates/gitlab-ci/ci/ruby-ci.yml
# Purpose: GitLab CI pipeline for Ruby applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

variables:
  RUBY_VERSION: "3.2"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

stages:
  - build
  - test
  - sast
  - publish

# Build Stage
build:
  stage: build
  image: ruby:$RUBY_VERSION
  cache:
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path 'vendor/bundle'
    - bundle install --jobs 4 --retry 3
  script:
    - echo "Build completed"
  artifacts:
    paths:
      - ./
    exclude:
      - .git
      - spec
      - test
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Test Stage
test:
  stage: test
  image: ruby:$RUBY_VERSION
  dependencies:
    - build
  cache:
    paths:
      - vendor/bundle
  before_script:
    - bundle config set --local path 'vendor/bundle'
    - bundle install
  script:
    - bundle exec rspec --format RspecJunitFormatter --out rspec.xml
    - bundle exec rubocop
  artifacts:
    reports:
      junit: rspec.xml
  only:
    - main
    - develop
    - merge_requests

# Security Scan Stage
sast:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - test
  script:
    # Gitleaks — Secret Detection
    - docker run --rm -v $PWD:/path zricethezav/gitleaks:latest detect --source="/path" --verbose || true
    # Semgrep — Code Analysis
    - docker run --rm -v $PWD:/src returntocorp/semgrep --config=auto /src || true
    # Trivy — Dependency Scan
    - docker run --rm -v $PWD:/workspace aquasec/trivy fs /workspace || true
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Publish Stage
publish:
  stage: publish
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Publishing $ARTIFACT_NAME"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - ./
    exclude:
      - .git
      - spec
      - test
    expire_in: 1 week
  only:
    - main
    - develop