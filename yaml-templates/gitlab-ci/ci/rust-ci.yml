---
# yaml-templates/gitlab-ci/ci/rust-ci.yml
# Purpose: GitLab CI pipeline for Rust applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

variables:
  RUST_VERSION: "stable"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

stages:
  - build
  - test
  - sast
  - publish

# Build Stage
build:
  stage: build
  image: rust:$RUST_VERSION
  cache:
    paths:
      - target/
      - ~/.cargo/
  script:
    - rustc --version && cargo --version
    - cargo build --release
  artifacts:
    paths:
      - target/release/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests

# Test Stage
test:
  stage: test
  image: rust:$RUST_VERSION
  dependencies:
    - build
  cache:
    paths:
      - target/
      - ~/.cargo/
  script:
    - rustup component add rustfmt clippy
    - cargo test --verbose
    - cargo clippy -- -D warnings
    - cargo fmt -- --check
  only:
    - main
    - develop
    - merge_requests

# Security Scan Stage
sast:
  stage: sast
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - test
  script:
    # Gitleaks — Secret Detection
    - docker run --rm -v $PWD:/path zricethezav/gitleaks:latest detect --source="/path" --verbose || true
    # Semgrep — Code Analysis
    - docker run --rm -v $PWD:/src returntocorp/semgrep --config=auto /src || true
    # Trivy — Dependency Scan
    - docker run --rm -v $PWD:/workspace aquasec/trivy fs /workspace || true
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Publish Stage
publish:
  stage: publish
  image: alpine:latest
  dependencies:
    - build
  script:
    - echo "Publishing $ARTIFACT_NAME"
  artifacts:
    name: "$ARTIFACT_NAME"
    paths:
      - target/release/
    expire_in: 1 week
  only:
    - main
    - develop