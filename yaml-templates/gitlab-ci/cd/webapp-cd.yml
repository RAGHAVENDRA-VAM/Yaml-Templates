---
# GitLab CI CD Pipeline for Web App Deployment
# Single Deploy stage for Azure Web App deployment

stages:
  - deploy

variables:
  AZURE_WEBAPP_NAME: "your-webapp-name"
  AZURE_RESOURCE_GROUP: "your-resource-group"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

deploy_stage:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  environment:
    name: production
    url: https://$AZURE_WEBAPP_NAME.azurewebsites.net
  script:
    - echo "Deploying to Azure Web App"
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp deployment source config-zip --resource-group $AZURE_RESOURCE_GROUP --name $AZURE_WEBAPP_NAME --src $ARTIFACT_NAME.zip
  artifacts:
    reports:
      deployment: deployment-report.json
  only:
    - main
  when: manual