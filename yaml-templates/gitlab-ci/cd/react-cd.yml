---
# yaml-templates/gitlab-ci/cd/react-cd.yml
# Purpose: GitLab CI CD pipeline for React applications.
# Stages: Download → Deploy → Verify
# Targets: Azure Web App, S3, Static hosting

variables:
  AZURE_WEBAPP_NAME: "my-react-app"
  AZURE_WEBAPP_PACKAGE_PATH: "./build"
  NODE_VERSION: "20"

stages:
  - deploy-staging
  - deploy-production

# Deploy to Staging
deploy_staging:
  stage: deploy-staging
  image: node:$NODE_VERSION
  dependencies:
    - build  # From CI pipeline
  script:
    - echo "Deploying to staging environment"
    - npm install -g @azure/static-web-apps-cli
    - swa deploy ./build --env staging
  environment:
    name: staging
    url: https://$AZURE_WEBAPP_NAME-staging.azurestaticapps.net
  only:
    - main
  when: manual

# Deploy to Production
deploy_production:
  stage: deploy-production
  image: node:$NODE_VERSION
  dependencies:
    - build  # From CI pipeline
  script:
    - echo "Deploying to production environment"
    - npm install -g @azure/static-web-apps-cli
    - swa deploy ./build --env production
    # Verify deployment
    - curl -f https://$AZURE_WEBAPP_NAME.azurestaticapps.net || exit 1
  environment:
    name: production
    url: https://$AZURE_WEBAPP_NAME.azurestaticapps.net
  only:
    - main
  when: manual
  needs:
    - deploy_staging