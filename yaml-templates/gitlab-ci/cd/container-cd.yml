---
# GitLab CI CD Pipeline for Container Deployment
# Single Deploy stage for Azure Container Apps deployment

stages:
  - deploy

variables:
  AZURE_SUBSCRIPTION: "your-azure-subscription"
  RESOURCE_GROUP: "your-resource-group"
  CONTAINER_APP: "your-container-app"
  CONTAINER_REGISTRY: "your-acr.azurecr.io"
  IMAGE_NAME: "your-app"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

deploy_stage:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  services:
    - docker:dind
  environment:
    name: production
  script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - docker build -t $CONTAINER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA .
    - docker push $CONTAINER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA
    - az containerapp update --name $CONTAINER_APP --resource-group $RESOURCE_GROUP --image $CONTAINER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA
  only:
    - main
  when: manual