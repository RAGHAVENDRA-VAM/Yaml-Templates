---
# GitLab CI CD Pipeline for VM Deployment
# Single Deploy stage for Virtual Machine deployment

stages:
  - deploy

variables:
  AZURE_RESOURCE_GROUP: "your-resource-group"
  VM_NAME: "your-vm"
  DEPLOYMENT_PATH: "/opt/app"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

deploy_stage:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  environment:
    name: production
  script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az vm run-command invoke --resource-group $AZURE_RESOURCE_GROUP --name $VM_NAME --command-id RunShellScript --scripts "sudo mkdir -p $DEPLOYMENT_PATH && sudo chown \$(whoami):\$(whoami) $DEPLOYMENT_PATH"
    - scp -r ./* azureuser@$VM_NAME:$DEPLOYMENT_PATH/
    - az vm run-command invoke --resource-group $AZURE_RESOURCE_GROUP --name $VM_NAME --command-id RunShellScript --scripts "cd $DEPLOYMENT_PATH && chmod +x deploy.sh && ./deploy.sh"
  only:
    - main
  when: manual