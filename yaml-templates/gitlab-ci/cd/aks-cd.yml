---
# GitLab CI CD Pipeline for AKS Deployment
# Single Deploy stage for Kubernetes deployment

stages:
  - deploy

variables:
  AZURE_SUBSCRIPTION: "your-azure-subscription"
  RESOURCE_GROUP: "your-resource-group"
  AKS_CLUSTER: "your-aks-cluster"
  CONTAINER_REGISTRY: "your-acr.azurecr.io"
  IMAGE_NAME: "your-app"
  NAMESPACE: "default"
  PROJECT_NAME: "$CI_PROJECT_NAME"
  ARTIFACT_NAME: "$CI_PROJECT_NAME-drop"

deploy_stage:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  services:
    - docker:dind
  environment:
    name: production
  script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az aks get-credentials --resource-group $RESOURCE_GROUP --name $AKS_CLUSTER
    - docker build -t $CONTAINER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA .
    - docker push $CONTAINER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA
    - kubectl set image deployment/$IMAGE_NAME $IMAGE_NAME=$CONTAINER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA -n $NAMESPACE
    - kubectl rollout status deployment/$IMAGE_NAME -n $NAMESPACE
  only:
    - main
  when: manual