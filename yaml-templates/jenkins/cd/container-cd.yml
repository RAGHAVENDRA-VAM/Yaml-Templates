---
# yaml-templates/jenkins/cd/container-cd.yml
# Purpose: Jenkins CD pipeline for deploying as Docker container.
# Stages: Deploy
# Target: Docker container with build, push, and run

pipeline {
  agent any

  environment {
    PROJECT_NAME = "${env.JOB_NAME.split('/')[0]}"
    ARTIFACT_NAME = "${PROJECT_NAME}-drop"
    ENVIRONMENT = 'dev'
    CONTAINER_REGISTRY = credentials('CONTAINER_REGISTRY')
    REGISTRY_USERNAME = credentials('REGISTRY_USERNAME')
    REGISTRY_PASSWORD = credentials('REGISTRY_PASSWORD')
  }

  triggers {
    upstream(upstreamProjects: 'ci-pipeline', threshold: hudson.model.Result.SUCCESS)
  }

  stages {
    // Deploy stage — deploy as container
    stage('Deploy Container') {
      steps {
        echo "Deploying as Docker Container: ${env.PROJECT_NAME}"
        
        // Copy artifacts from upstream CI job
        copyArtifacts(
          projectName: 'ci-pipeline',
          selector: lastSuccessful(),
          target: 'artifacts/'
        )

        // Login to container registry
        sh '''
          echo ${REGISTRY_PASSWORD} | docker login ${CONTAINER_REGISTRY} \
            -u ${REGISTRY_USERNAME} --password-stdin
        '''

        // Build Docker image
        sh '''
          docker build \
            -t ${CONTAINER_REGISTRY}/${PROJECT_NAME}:${BUILD_ID} \
            -t ${CONTAINER_REGISTRY}/${PROJECT_NAME}:latest \
            artifacts/
        '''

        // Push Docker image to registry
        sh '''
          docker push ${CONTAINER_REGISTRY}/${PROJECT_NAME}:${BUILD_ID}
          docker push ${CONTAINER_REGISTRY}/${PROJECT_NAME}:latest
        '''

        // Stop and remove existing container
        script {
          try {
            sh '''
              docker stop ${PROJECT_NAME} || true
              docker rm ${PROJECT_NAME} || true
            '''
          } catch (Exception e) {
            echo "No existing container to stop: ${e.getMessage()}"
          }
        }

        // Pull and run new container
        sh '''
          docker pull ${CONTAINER_REGISTRY}/${PROJECT_NAME}:${BUILD_ID}
          docker run -d \
            --name ${PROJECT_NAME} \
            --restart unless-stopped \
            -p 80:8080 \
            -e ENVIRONMENT=${ENVIRONMENT} \
            ${CONTAINER_REGISTRY}/${PROJECT_NAME}:${BUILD_ID}
        '''

        // Verify container is running
        script {
          sleep(10)
          try {
            sh '''
              if docker ps | grep -q ${PROJECT_NAME}; then
                echo "✅ Container ${PROJECT_NAME} is running"
                docker ps | grep ${PROJECT_NAME}
                docker logs ${PROJECT_NAME} --tail 20
              else
                echo "❌ Container ${PROJECT_NAME} failed to start"
                docker logs ${PROJECT_NAME} || true
                exit 1
              fi
            '''
          } catch (Exception e) {
            echo "❌ Container verification failed: ${e.getMessage()}"
            throw e
          }
        }

        // Container health check
        script {
          sleep(30)
          try {
            sh '''
              curl --fail --silent --max-time 30 http://localhost/health
              echo "✅ Container health check passed"
            '''
          } catch (Exception e) {
            echo "⚠️ Container health check failed: ${e.getMessage()}"
          }
        }
      }
    }
  }

  post {
    always {
      cleanWs()
    }
    success {
      echo "✅ CD pipeline completed successfully"
    }
    failure {
      echo "❌ CD pipeline failed"
    }
  }
}