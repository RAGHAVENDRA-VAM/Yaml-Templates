---
// Jenkins CD Pipeline for Container Deployment
// Single Deploy stage for Azure Container Apps deployment

pipeline {
    agent any
    
    environment {
        AZURE_SUBSCRIPTION = 'your-azure-subscription'
        RESOURCE_GROUP = 'your-resource-group'
        CONTAINER_APP = 'your-container-app'
        CONTAINER_REGISTRY = 'your-acr.azurecr.io'
        IMAGE_NAME = 'your-app'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    stages {
        stage('Deploy Stage') {
            steps {
                script {
                    // Download artifacts from CI build
                    copyArtifacts(
                        projectName: "${PROJECT_NAME}-ci",
                        selector: lastSuccessful(),
                        target: 'artifacts/'
                    )
                    
                    // Deploy to Container Apps
                    withCredentials([azureServicePrincipal('azure-service-principal')]) {
                        sh '''
                            az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
                            
                            docker build -t $CONTAINER_REGISTRY/$IMAGE_NAME:$BUILD_NUMBER artifacts/
                            docker push $CONTAINER_REGISTRY/$IMAGE_NAME:$BUILD_NUMBER
                            
                            az containerapp update \
                                --name $CONTAINER_APP \
                                --resource-group $RESOURCE_GROUP \
                                --image $CONTAINER_REGISTRY/$IMAGE_NAME:$BUILD_NUMBER
                        '''
                    }
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}