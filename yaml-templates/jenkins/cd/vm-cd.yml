---
// Jenkins CD Pipeline for VM Deployment
// Single Deploy stage for Virtual Machine deployment

pipeline {
    agent any
    
    environment {
        AZURE_RESOURCE_GROUP = 'your-resource-group'
        VM_NAME = 'your-vm'
        DEPLOYMENT_PATH = '/opt/app'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    stages {
        stage('Deploy Stage') {
            steps {
                script {
                    // Download artifacts from CI build
                    copyArtifacts(
                        projectName: "${PROJECT_NAME}-ci",
                        selector: lastSuccessful(),
                        target: 'artifacts/'
                    )
                    
                    // Deploy to VM
                    withCredentials([azureServicePrincipal('azure-service-principal')]) {
                        sh '''
                            az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
                            
                            # Prepare VM directory
                            az vm run-command invoke \
                                --resource-group $AZURE_RESOURCE_GROUP \
                                --name $VM_NAME \
                                --command-id RunShellScript \
                                --scripts "sudo mkdir -p $DEPLOYMENT_PATH && sudo chown \\$(whoami):\\$(whoami) $DEPLOYMENT_PATH"
                            
                            # Copy files to VM
                            scp -r artifacts/* azureuser@$VM_NAME:$DEPLOYMENT_PATH/
                            
                            # Execute deployment script
                            az vm run-command invoke \
                                --resource-group $AZURE_RESOURCE_GROUP \
                                --name $VM_NAME \
                                --command-id RunShellScript \
                                --scripts "cd $DEPLOYMENT_PATH && chmod +x deploy.sh && ./deploy.sh"
                        '''
                    }
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}