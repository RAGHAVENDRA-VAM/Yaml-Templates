---
// Jenkins CD Pipeline for Web App Deployment
// Single Deploy stage for Azure Web App deployment

pipeline {
    agent any
    
    environment {
        AZURE_WEBAPP_NAME = 'your-webapp-name'
        AZURE_RESOURCE_GROUP = 'your-resource-group'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    stages {
        stage('Deploy Stage') {
            steps {
                script {
                    // Download artifacts from CI build
                    copyArtifacts(
                        projectName: "${PROJECT_NAME}-ci",
                        selector: lastSuccessful(),
                        target: 'artifacts/'
                    )
                    
                    // Deploy to Azure Web App
                    withCredentials([azureServicePrincipal('azure-service-principal')]) {
                        sh '''
                            az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
                            az webapp deployment source config-zip --resource-group $AZURE_RESOURCE_GROUP --name $AZURE_WEBAPP_NAME --src artifacts/${ARTIFACT_NAME}.zip
                        '''
                    }
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}