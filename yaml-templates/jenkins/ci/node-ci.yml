---
// Jenkins CI Pipeline for Node.js Applications
// Follows Build -> SAST -> Publish structure with mandatory security scanning

pipeline {
    agent any
    
    environment {
        NODE_VERSION = '20'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    tools {
        nodejs "${NODE_VERSION}"
    }
    
    stages {
        stage('Build Stage') {
            steps {
                script {
                    sh 'npm ci'
                    sh 'npm run build'
                    sh 'npm test'
                }
            }
            post {
                always {
                    publishTestResults testResultsPattern: 'test-results.xml'
                    publishCoverage adapters: [coberturaAdapter('coverage/cobertura-coverage.xml')], sourceFileResolver: sourceFiles('STORE_LAST_BUILD')
                }
            }
        }
        
        stage('SAST Stage') {
            parallel {
                stage('Gitleaks Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true'
                        }
                    }
                }
                stage('Semgrep Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true'
                        }
                    }
                }
                stage('Trivy Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true'
                        }
                    }
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: '*-report.json', allowEmptyArchive: true
                }
            }
        }
        
        stage('Publish Stage') {
            steps {
                script {
                    echo 'Publishing Node.js application artifacts'
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: 'dist/**,build/**,package.json,package-lock.json,*.yml,*.yaml', allowEmptyArchive: true
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}