---
# yaml-templates/jenkins/ci/react-ci.yml
# Purpose: Jenkins CI pipeline for React applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

pipeline {
    agent any
    
    environment {
        NODE_VERSION = '20.x'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    tools {
        nodejs "${NODE_VERSION}"
    }
    
    stages {
        stage('Build') {
            steps {
                echo 'Building React Application'
                sh 'npm ci'
                sh 'npm run build'
                archiveArtifacts artifacts: 'build/**', fingerprint: true
            }
        }
        
        stage('Test') {
            steps {
                echo 'Running Tests'
                sh 'npm test -- --coverage --watchAll=false'
                publishHTML([
                    allowMissing: false,
                    alwaysLinkToLastBuild: true,
                    keepAll: true,
                    reportDir: 'coverage/lcov-report',
                    reportFiles: 'index.html',
                    reportName: 'Coverage Report'
                ])
            }
        }
        
        stage('SAST') {
            parallel {
                stage('Gitleaks') {
                    steps {
                        script {
                            try {
                                sh 'docker run --rm -v ${WORKSPACE}:/path zricethezav/gitleaks:latest detect --source="/path" --verbose'
                            } catch (Exception e) {
                                echo "Gitleaks scan completed with findings: ${e.getMessage()}"
                            }
                        }
                    }
                }
                stage('Semgrep') {
                    steps {
                        script {
                            try {
                                sh 'docker run --rm -v ${WORKSPACE}:/src returntocorp/semgrep --config=auto /src'
                            } catch (Exception e) {
                                echo "Semgrep scan completed with findings: ${e.getMessage()}"
                            }
                        }
                    }
                }
                stage('Trivy') {
                    steps {
                        script {
                            try {
                                sh 'docker run --rm -v ${WORKSPACE}:/workspace aquasec/trivy fs /workspace'
                            } catch (Exception e) {
                                echo "Trivy scan completed with findings: ${e.getMessage()}"
                            }
                        }
                    }
                }
            }
        }
        
        stage('Publish') {
            steps {
                echo "Publishing ${ARTIFACT_NAME}"
                archiveArtifacts artifacts: 'build/**', fingerprint: true, allowEmptyArchive: false
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
        success {
            echo 'Pipeline completed successfully!'
        }
        failure {
            echo 'Pipeline failed!'
        }
    }
}