---
# yaml-templates/jenkins/ci/rust-ci.yml
# Purpose: Jenkins CI pipeline for Rust applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

pipeline {
    agent any
    
    environment {
        RUST_VERSION = 'stable'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
        PATH = "${HOME}/.cargo/bin:${PATH}"
    }
    
    stages {
        stage('Setup') {
            steps {
                echo 'Setting up Rust'
                sh '''
                    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                    source ~/.cargo/env
                    rustup component add rustfmt clippy
                '''
            }
        }
        
        stage('Build') {
            steps {
                echo 'Building Rust Application'
                sh '''
                    source ~/.cargo/env
                    rustc --version && cargo --version
                    cargo build --release
                '''
                archiveArtifacts artifacts: 'target/release/**', fingerprint: true
            }
        }
        
        stage('Test') {
            steps {
                echo 'Running Tests'
                sh '''
                    source ~/.cargo/env
                    cargo test --verbose
                    cargo clippy -- -D warnings
                    cargo fmt -- --check
                '''
            }
        }
        
        stage('SAST') {
            parallel {
                stage('Gitleaks') {
                    steps {
                        script {
                            try {
                                sh 'docker run --rm -v ${WORKSPACE}:/path zricethezav/gitleaks:latest detect --source="/path" --verbose'
                            } catch (Exception e) {
                                echo "Gitleaks scan completed with findings: ${e.getMessage()}"
                            }
                        }
                    }
                }
                stage('Semgrep') {
                    steps {
                        script {
                            try {
                                sh 'docker run --rm -v ${WORKSPACE}:/src returntocorp/semgrep --config=auto /src'
                            } catch (Exception e) {
                                echo "Semgrep scan completed with findings: ${e.getMessage()}"
                            }
                        }
                    }
                }
                stage('Trivy') {
                    steps {
                        script {
                            try {
                                sh 'docker run --rm -v ${WORKSPACE}:/workspace aquasec/trivy fs /workspace'
                            } catch (Exception e) {
                                echo "Trivy scan completed with findings: ${e.getMessage()}"
                            }
                        }
                    }
                }
            }
        }
        
        stage('Publish') {
            steps {
                echo "Publishing ${ARTIFACT_NAME}"
                archiveArtifacts artifacts: 'target/release/**', fingerprint: true, allowEmptyArchive: false
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
        success {
            echo 'Pipeline completed successfully!'
        }
        failure {
            echo 'Pipeline failed!'
        }
    }
}