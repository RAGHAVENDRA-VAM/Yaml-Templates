---
# yaml-templates/jenkins/ci/python-ci.yml
# Purpose: Jenkins CI pipeline for Python applications.
# Stages: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

pipeline {
  agent any

  environment {
    PYTHON_VERSION = '3.12'
    PROJECT_NAME = "${env.JOB_NAME.split('/')[0]}"
    ARTIFACT_NAME = "${PROJECT_NAME}-drop"
  }

  triggers {
    pollSCM('H/5 * * * *')
  }

  stages {
    // Stage 1: Build — Build Python application
    stage('Build') {
      steps {
        echo "Building Python application: ${env.PROJECT_NAME}"
        
        // Install Python (if not available)
        sh '''
          if ! command -v python3 &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y python3 python3-pip
          fi
        '''
        
        // Install dependencies and build
        sh 'pip3 install -r requirements.txt'
        sh 'pip3 install build'
        sh 'python3 -m build --outdir dist/'
      }
      post {
        success {
          archiveArtifacts artifacts: 'dist/**', fingerprint: true
        }
      }
    }

    // Stage 2: Test — Run unit tests
    stage('Test') {
      steps {
        echo "Running unit tests"
        sh 'pip3 install -r requirements.txt'
        sh 'pytest --tb=short --junitxml=test-results.xml'
      }
      post {
        always {
          publishTestResults testResultsPattern: 'test-results.xml'
        }
      }
    }

    // Stage 3: SAST — Security scanning (mandatory)
    stage('SAST') {
      parallel {
        stage('Gitleaks') {
          steps {
            script {
              try {
                sh 'gitleaks detect --source . --verbose'
              } catch (Exception e) {
                echo "Gitleaks scan failed: ${e.getMessage()}"
              }
            }
          }
        }
        stage('Semgrep') {
          steps {
            script {
              try {
                sh 'semgrep scan --config auto --json --output semgrep-report.json'
              } catch (Exception e) {
                echo "Semgrep scan failed: ${e.getMessage()}"
              }
            }
          }
        }
        stage('Trivy') {
          steps {
            script {
              try {
                sh 'trivy fs . --format json --output trivy-report.json'
              } catch (Exception e) {
                echo "Trivy scan failed: ${e.getMessage()}"
              }
            }
          }
        }
      }
      post {
        always {
          archiveArtifacts artifacts: '*-report.json', allowEmptyArchive: true
        }
      }
    }

    // Stage 4: Publish — Publish final artifact
    stage('Publish') {
      steps {
        echo "Publishing ${env.ARTIFACT_NAME}"
        sh 'pip3 install -r requirements.txt'
        sh 'pip3 install build'
        sh 'python3 -m build --outdir dist/'
        archiveArtifacts artifacts: 'dist/**', fingerprint: true
      }
    }
  }

  post {
    always {
      cleanWs()
    }
    success {
      echo "✅ CI pipeline completed successfully"
    }
    failure {
      echo "❌ CI pipeline failed"
    }
  }
}