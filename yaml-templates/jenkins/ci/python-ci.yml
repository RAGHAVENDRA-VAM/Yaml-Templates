---
// Jenkins CI Pipeline for Python Applications
// Follows Build -> SAST -> Publish structure with mandatory security scanning

pipeline {
    agent any
    
    environment {
        PYTHON_VERSION = '3.11'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    stages {
        stage('Build Stage') {
            steps {
                script {
                    sh 'python3 -m pip install --upgrade pip'
                    sh 'pip install -r requirements.txt'
                    sh 'python -m pytest tests/ --junitxml=test-results.xml --cov=. --cov-report=xml'
                }
            }
            post {
                always {
                    publishTestResults testResultsPattern: 'test-results.xml'
                    publishCoverage adapters: [coberturaAdapter('coverage.xml')], sourceFileResolver: sourceFiles('STORE_LAST_BUILD')
                }
            }
        }
        
        stage('SAST Stage') {
            parallel {
                stage('Gitleaks Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true'
                        }
                    }
                }
                stage('Semgrep Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true'
                        }
                    }
                }
                stage('Trivy Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true'
                        }
                    }
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: '*-report.json', allowEmptyArchive: true
                }
            }
        }
        
        stage('Publish Stage') {
            steps {
                script {
                    echo 'Publishing Python application artifacts'
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: '*.py,requirements.txt,*.yml,*.yaml', allowEmptyArchive: true
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}