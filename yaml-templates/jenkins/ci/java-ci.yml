---
// Jenkins CI Pipeline for Java Applications
// Follows Build -> SAST -> Publish structure with mandatory security scanning

pipeline {
    agent any
    
    environment {
        JAVA_VERSION = '17'
        MAVEN_OPTS = '-Dmaven.repo.local=${WORKSPACE}/.m2/repository'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    tools {
        jdk "${JAVA_VERSION}"
        maven 'Maven'
    }
    
    stages {
        stage('Build Stage') {
            steps {
                script {
                    sh 'mvn clean compile'
                    sh 'mvn test'
                }
            }
            post {
                always {
                    publishTestResults testResultsPattern: 'target/surefire-reports/TEST-*.xml'
                }
            }
        }
        
        stage('SAST Stage') {
            parallel {
                stage('Gitleaks Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true'
                        }
                    }
                }
                stage('Semgrep Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true'
                        }
                    }
                }
                stage('Trivy Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true'
                        }
                    }
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: '*-report.json', allowEmptyArchive: true
                }
            }
        }
        
        stage('Publish Stage') {
            steps {
                script {
                    sh 'mvn package -DskipTests'
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: 'target/*.jar,target/*.war,*.yml,*.yaml', allowEmptyArchive: true
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}