---
// Jenkins CI Pipeline for .NET Applications
// Follows Build -> SAST -> Publish structure with mandatory security scanning

pipeline {
    agent any
    
    environment {
        DOTNET_VERSION = '8.0'
        PROJECT_NAME = "${env.JOB_NAME}"
        ARTIFACT_NAME = "${env.JOB_NAME}-drop"
    }
    
    stages {
        stage('Build Stage') {
            steps {
                script {
                    sh 'dotnet restore'
                    sh 'dotnet build --configuration Release --no-restore'
                    sh 'dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage'
                }
            }
            post {
                always {
                    publishTestResults testResultsPattern: 'coverage/**/*.xml'
                    publishCoverage adapters: [coberturaAdapter('coverage/**/coverage.cobertura.xml')], sourceFileResolver: sourceFiles('STORE_LAST_BUILD')
                }
            }
        }
        
        stage('SAST Stage') {
            parallel {
                stage('Gitleaks Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true'
                        }
                    }
                }
                stage('Semgrep Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true'
                        }
                    }
                }
                stage('Trivy Scan') {
                    steps {
                        script {
                            sh 'docker run --rm -v ${WORKSPACE}:/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true'
                        }
                    }
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: '*-report.json', allowEmptyArchive: true
                }
            }
        }
        
        stage('Publish Stage') {
            steps {
                script {
                    sh 'dotnet publish --configuration Release --output ./publish --no-restore'
                }
            }
            post {
                always {
                    archiveArtifacts artifacts: 'publish/**,*.yml,*.yaml', allowEmptyArchive: true
                }
            }
        }
    }
    
    post {
        always {
            cleanWs()
        }
    }
}