---
# Azure DevOps CD Pipeline for AKS Deployment
# Single Deploy stage for Kubernetes deployment

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azure_subscription: 'your-azure-subscription'
  resource_group: 'your-resource-group'
  aks_cluster: 'your-aks-cluster'
  container_registry: 'your-acr.azurecr.io'
  image_name: 'your-app'
  namespace: 'default'
  project_name: '$(Build.Repository.Name)'
  artifact_name: '$(Build.Repository.Name)-drop'

stages:
  - stage: deploy_stage
    displayName: 'Deploy Stage'
    jobs:
      - deployment: deploy_to_aks
        displayName: 'Deploy to AKS'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: '$(artifact_name)'
                    downloadPath: '$(Pipeline.Workspace)'
                  displayName: 'Download Build Artifacts'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azure_subscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials --resource-group $(resource_group) --name $(aks_cluster)
                  displayName: 'Get AKS Credentials'

                - task: Docker@2
                  inputs:
                    containerRegistry: '$(container_registry)'
                    repository: '$(image_name)'
                    command: 'buildAndPush'
                    Dockerfile: '**/Dockerfile'
                    tags: |
                      $(Build.BuildId)
                      latest
                  displayName: 'Build and Push Docker Image'

                - task: KubernetesManifest@0
                  inputs:
                    action: 'deploy'
                    kubernetesServiceConnection: '$(azure_subscription)'
                    namespace: '$(namespace)'
                    manifests: |
                      $(Pipeline.Workspace)/$(artifact_name)/k8s/*.yml
                      $(Pipeline.Workspace)/$(artifact_name)/k8s/*.yaml
                    containers: '$(container_registry)/$(image_name):$(Build.BuildId)'
                  displayName: 'Deploy to AKS'