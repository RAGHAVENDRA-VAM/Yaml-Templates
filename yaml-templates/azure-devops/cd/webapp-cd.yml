---
# yaml-templates/azure-devops/cd/webapp-cd.yml
# Purpose: Azure DevOps CD pipeline for deploying to Azure Web App.
# Stages: Deploy

trigger: none

resources:
  pipelines:
    - pipeline: ci_pipeline
      source: ci
      trigger:
        branches:
          include:
            - main

variables:
  project_name: "$(Build.Repository.Name)"
  artifact_name: "$(project_name)-drop"
  azure_subscription: "$(AZURE_SUBSCRIPTION)"
  resource_group: "$(RESOURCE_GROUP)"

stages:
  - stage: Deploy_WebApp
    displayName: "Deploy to Azure Web App"
    jobs:
      - deployment: DeployJob
        displayName: "Deploy to Web App"
        pool:
          vmImage: "ubuntu-latest"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  displayName: "Download $(artifact_name)"
                  inputs:
                    buildType: "specific"
                    project: "$(System.TeamProjectId)"
                    pipeline: "$(resources.pipeline.ci_pipeline.pipelineID)"
                    buildVersionToDownload: "latest"
                    artifactName: "$(artifact_name)"
                    downloadPath: "$(System.ArtifactsDirectory)"

                - task: AzureWebApp@1
                  displayName: "Deploy to Azure Web App"
                  inputs:
                    azureSubscription: "$(azure_subscription)"
                    appType: "webApp"
                    appName: "$(project_name)"
                    resourceGroupName: "$(resource_group)"
                    package: "$(System.ArtifactsDirectory)/$(artifact_name)/**"
                    deploymentMethod: "auto"