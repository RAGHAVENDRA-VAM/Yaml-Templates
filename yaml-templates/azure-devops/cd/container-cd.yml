---
# Azure DevOps CD Pipeline for Container Deployment
# Single Deploy stage for Azure Container Apps deployment

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azure_subscription: 'your-azure-subscription'
  resource_group: 'your-resource-group'
  container_app: 'your-container-app'
  container_registry: 'your-acr.azurecr.io'
  image_name: 'your-app'
  project_name: '$(Build.Repository.Name)'
  artifact_name: '$(Build.Repository.Name)-drop'

stages:
  - stage: deploy_stage
    displayName: 'Deploy Stage'
    jobs:
      - deployment: deploy_container
        displayName: 'Deploy Container'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: '$(artifact_name)'
                    downloadPath: '$(Pipeline.Workspace)'
                  displayName: 'Download Build Artifacts'

                - task: Docker@2
                  inputs:
                    containerRegistry: '$(container_registry)'
                    repository: '$(image_name)'
                    command: 'buildAndPush'
                    Dockerfile: '$(Pipeline.Workspace)/$(artifact_name)/Dockerfile'
                    buildContext: '$(Pipeline.Workspace)/$(artifact_name)'
                    tags: |
                      $(Build.BuildId)
                      latest
                  displayName: 'Build and Push Docker Image'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azure_subscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az containerapp update \
                        --name $(container_app) \
                        --resource-group $(resource_group) \
                        --image $(container_registry)/$(image_name):$(Build.BuildId)
                  displayName: 'Deploy to Container Apps'