---
# yaml-templates/azure-devops/cd/vm-cd.yml
# Purpose: Azure DevOps CD pipeline for deploying to Virtual Machine via SSH.
# Stages: Download → Deploy
# Target: VM with SSH copy, service restart, and health check

trigger: none

# CD triggers when CI pipeline completes successfully
resources:
  pipelines:
    - pipeline: ci_pipeline
      source: ci
      trigger:
        branches:
          include:
            - main

variables:
  project_name: "$(Build.Repository.Name)"
  artifact_name: "$(project_name)-drop"
  environment: "dev"
  vm_ssh_connection: "$(VM_SSH_CONNECTION)"

stages:
  # Stage 1: Deploy to VM
  - stage: Deploy_VM
    displayName: "Deploy to Virtual Machine"
    jobs:
      - deployment: DeployJob
        displayName: "Deploy to VM"
        pool:
          vmImage: "ubuntu-latest"
        environment: "$(environment)"
        strategy:
          runOnce:
            deploy:
              steps:
                # Download artifact from CI pipeline
                - task: DownloadBuildArtifacts@0
                  displayName: "Download $(artifact_name)"
                  inputs:
                    buildType: "specific"
                    project: "$(System.TeamProjectId)"
                    pipeline: "$(resources.pipeline.ci_pipeline.pipelineID)"
                    buildVersionToDownload: "latest"
                    artifactName: "$(artifact_name)"
                    downloadPath: "$(System.ArtifactsDirectory)"

                # Copy artifact to VM
                - task: CopyFilesOverSSH@0
                  displayName: "Copy Artifact to VM"
                  inputs:
                    sshEndpoint: "$(vm_ssh_connection)"
                    sourceFolder: "$(System.ArtifactsDirectory)/$(artifact_name)"
                    contents: "**"
                    targetFolder: "/app/releases/$(Build.BuildId)"
                    cleanTargetFolder: false

                # Deploy on VM — extract and restart service
                - task: SSH@0
                  displayName: "Deploy Application on VM"
                  inputs:
                    sshEndpoint: "$(vm_ssh_connection)"
                    runOptions: "inline"
                    inline: |
                      # Create backup of current version
                      sudo cp -r /app/current /app/backup/$(date +%Y%m%d_%H%M%S) || true
                      
                      # Deploy new version
                      cd /app/releases/$(Build.BuildId)
                      sudo cp -r * /app/current/
                      
                      # Set permissions
                      sudo chown -R appuser:appuser /app/current
                      sudo chmod +x /app/current/start.sh || true
                      
                      # Restart service
                      sudo systemctl restart $(project_name)

                # Verify service health
                - task: SSH@0
                  displayName: "Verify Service Health"
                  inputs:
                    sshEndpoint: "$(vm_ssh_connection)"
                    runOptions: "inline"
                    inline: |
                      # Wait for service to start
                      sleep 10
                      
                      # Check service status
                      if systemctl is-active --quiet $(project_name); then
                        echo "✅ Service $(project_name) is running"
                        systemctl status $(project_name) --no-pager
                      else
                        echo "❌ Service $(project_name) failed to start"
                        systemctl status $(project_name) --no-pager
                        exit 1
                      fi

                # Health check via HTTP (if applicable)
                - task: SSH@0
                  displayName: "HTTP Health Check"
                  inputs:
                    sshEndpoint: "$(vm_ssh_connection)"
                    runOptions: "inline"
                    inline: >
                      curl --fail --silent --max-time 30 http://localhost:8080/health
                      && echo "✅ HTTP health check passed"
                      || echo "⚠️ HTTP health check failed"
                  continueOnError: true