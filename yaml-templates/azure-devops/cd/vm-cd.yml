---
# Azure DevOps CD Pipeline for VM Deployment
# Single Deploy stage for Virtual Machine deployment

trigger: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  azure_subscription: 'your-azure-subscription'
  resource_group: 'your-resource-group'
  vm_name: 'your-vm'
  deployment_path: '/opt/app'
  project_name: '$(Build.Repository.Name)'
  artifact_name: '$(Build.Repository.Name)-drop'

stages:
  - stage: deploy_stage
    displayName: 'Deploy Stage'
    jobs:
      - deployment: deploy_to_vm
        displayName: 'Deploy to VM'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: '$(artifact_name)'
                    downloadPath: '$(Pipeline.Workspace)'
                  displayName: 'Download Build Artifacts'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azure_subscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az vm run-command invoke \
                        --resource-group $(resource_group) \
                        --name $(vm_name) \
                        --command-id RunShellScript \
                        --scripts "sudo mkdir -p $(deployment_path) && sudo chown $(whoami):$(whoami) $(deployment_path)"
                  displayName: 'Prepare VM Directory'

                - task: AzureFileCopy@4
                  inputs:
                    SourcePath: '$(Pipeline.Workspace)/$(artifact_name)/*'
                    azureSubscription: '$(azure_subscription)'
                    Destination: 'AzureVMs'
                    storage: 'your-storage-account'
                    resourceGroup: '$(resource_group)'
                    vmsAdminUserName: 'azureuser'
                    vmsAdminPassword: '$(vm_admin_password)'
                    targetPath: '$(deployment_path)'
                    machineNames: '$(vm_name)'
                  displayName: 'Copy Files to VM'

                - task: AzureCLI@2
                  inputs:
                    azureSubscription: '$(azure_subscription)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az vm run-command invoke \
                        --resource-group $(resource_group) \
                        --name $(vm_name) \
                        --command-id RunShellScript \
                        --scripts "cd $(deployment_path) && chmod +x deploy.sh && ./deploy.sh"
                  displayName: 'Execute Deployment Script'