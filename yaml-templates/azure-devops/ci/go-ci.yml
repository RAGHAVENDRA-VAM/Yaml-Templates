---
# yaml-templates/azure-devops/ci/go-ci.yml
# Purpose: Azure DevOps CI pipeline for Go applications.
# Jobs: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main

variables:
  goVersion: '1.21'
  projectName: '$(Build.Repository.Name)'
  artifactName: '$(Build.Repository.Name)-drop'

stages:
- stage: Build
  displayName: 'Build Go Application'
  jobs:
  - job: BuildJob
    displayName: 'Build'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: GoTool@0
      displayName: 'Setup Go'
      inputs:
        version: '$(goVersion)'

    - task: Cache@2
      displayName: 'Cache Go Modules'
      inputs:
        key: 'go | "$(Agent.OS)" | go.sum'
        restoreKeys: |
          go | "$(Agent.OS)"
        path: '$(GOPATH)/pkg/mod'

    - script: go mod download
      displayName: 'Download Dependencies'

    - script: go build -o bin/app ./...
      displayName: 'Build Application'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        pathToPublish: 'bin'
        artifactName: 'build-output'

- stage: Test
  displayName: 'Run Tests'
  dependsOn: Build
  jobs:
  - job: TestJob
    displayName: 'Test'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: GoTool@0
      displayName: 'Setup Go'
      inputs:
        version: '$(goVersion)'

    - script: go test -v -race -coverprofile=coverage.out ./...
      displayName: 'Run Unit Tests'

    - task: PublishCodeCoverageResults@1
      displayName: 'Publish Coverage'
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'coverage.out'

- stage: SAST
  displayName: 'Security Scan'
  dependsOn: Test
  jobs:
  - job: SecurityJob
    displayName: 'Security'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - script: |
        docker run --rm -v $(Build.SourcesDirectory):/path zricethezav/gitleaks:latest detect --source="/path" --verbose
      displayName: 'Gitleaks — Secret Detection'
      continueOnError: true

    - script: |
        docker run --rm -v $(Build.SourcesDirectory):/src returntocorp/semgrep --config=auto /src
      displayName: 'Semgrep — Code Analysis'
      continueOnError: true

    - script: |
        docker run --rm -v $(Build.SourcesDirectory):/workspace aquasec/trivy fs /workspace
      displayName: 'Trivy — Dependency Scan'
      continueOnError: true

- stage: Publish
  displayName: 'Publish Artifact'
  dependsOn: SAST
  jobs:
  - job: PublishJob
    displayName: 'Publish'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: DownloadBuildArtifacts@0
      displayName: 'Download Build Artifact'
      inputs:
        artifactName: 'build-output'
        downloadPath: '$(System.ArtifactsDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish $(artifactName)'
      inputs:
        pathToPublish: '$(System.ArtifactsDirectory)/build-output'
        artifactName: '$(artifactName)'