---
# Azure DevOps CI Pipeline for Java Applications
# Follows Build -> SAST -> Publish structure with mandatory security scanning

trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  java_version: '17'
  maven_cache_folder: $(Pipeline.Workspace)/.m2/repository
  project_name: '$(Build.Repository.Name)'
  artifact_name: '$(Build.Repository.Name)-drop'

stages:
  - stage: build_stage
    displayName: 'Build Stage'
    jobs:
      - job: build_job
        displayName: 'Build Java Application'
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '$(java_version)'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: 'Setup Java $(java_version)'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(maven_cache_folder)
            displayName: 'Cache Maven Dependencies'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean compile'
              options: '-Dmaven.repo.local=$(maven_cache_folder)'
            displayName: 'Maven Compile'

          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'test'
              options: '-Dmaven.repo.local=$(maven_cache_folder)'
            displayName: 'Run Tests'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Java Tests'
            condition: succeededOrFailed()

  - stage: sast_stage
    displayName: 'SAST Stage'
    dependsOn: build_stage
    jobs:
      - job: security_scan
        displayName: 'Security Scanning'
        steps:
          - script: |
              docker run --rm -v $(Build.SourcesDirectory):/workspace zricethezav/gitleaks:latest detect --source /workspace --report-format json --report-path /workspace/gitleaks-report.json || true
            displayName: 'Gitleaks Secret Scan'
            continueOnError: true

          - script: |
              docker run --rm -v $(Build.SourcesDirectory):/src semgrep/semgrep --config=auto /src --json --output=/src/semgrep-report.json || true
            displayName: 'Semgrep SAST Scan'
            continueOnError: true

          - script: |
              docker run --rm -v $(Build.SourcesDirectory):/workspace aquasec/trivy fs /workspace --format json --output /workspace/trivy-report.json || true
            displayName: 'Trivy Vulnerability Scan'
            continueOnError: true

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.SourcesDirectory)'
              artifactName: 'security-reports'
            displayName: 'Publish Security Reports'

  - stage: publish_stage
    displayName: 'Publish Stage'
    dependsOn: sast_stage
    jobs:
      - job: publish_artifacts
        displayName: 'Publish Build Artifacts'
        steps:
          - task: Maven@3
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'package'
              options: '-Dmaven.repo.local=$(maven_cache_folder) -DskipTests'
            displayName: 'Maven Package'

          - task: CopyFiles@2
            inputs:
              sourceFolder: '$(Build.SourcesDirectory)'
              contents: |
                target/**/*.jar
                target/**/*.war
                **/*.yml
                **/*.yaml
              targetFolder: '$(Build.ArtifactStagingDirectory)'
            displayName: 'Copy Build Artifacts'

          - task: PublishBuildArtifacts@1
            inputs:
              pathToPublish: '$(Build.ArtifactStagingDirectory)'
              artifactName: '$(artifact_name)'
            displayName: 'Publish Build Artifacts'