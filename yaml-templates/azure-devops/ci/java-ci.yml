---
# yaml-templates/azure-devops/ci/java-ci.yml
# Purpose: Azure DevOps CI pipeline for Java applications.
# Stages: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

trigger:
  branches:
    include:
      - main
      - develop

variables:
  java_version: "21"
  maven_cache_folder: "$(Pipeline.Workspace)/.m2/repository"
  project_name: "$(Build.Repository.Name)"
  artifact_name: "$(project_name)-drop"

stages:
  # Stage 1: Build — Build Java application
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        displayName: "Build Java Application"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: "Install Java JDK"
            inputs:
              versionSpec: "$(java_version)"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - task: Cache@2
            displayName: "Cache Maven Dependencies"
            inputs:
              key: "maven | $(Agent.OS) | **/pom.xml"
              restoreKeys: |
                maven | $(Agent.OS)
                maven
              path: "$(maven_cache_folder)"

          - script: "mvn clean package -DskipTests --batch-mode"
            displayName: "Build Application"

          - task: CopyFiles@2
            displayName: "Stage Build Output"
            inputs:
              sourceFolder: "target"
              contents: "*.jar"
              targetFolder: "$(Build.ArtifactStagingDirectory)"

  # Stage 2: Test — Run unit tests
  - stage: Test
    displayName: "Unit Testing"
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: "Run Unit Tests"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: "Install Java JDK"
            inputs:
              versionSpec: "$(java_version)"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - task: Cache@2
            displayName: "Cache Maven Dependencies"
            inputs:
              key: "maven | $(Agent.OS) | **/pom.xml"
              restoreKeys: |
                maven | $(Agent.OS)
                maven
              path: "$(maven_cache_folder)"

          - script: "mvn test --batch-mode"
            displayName: "Run Unit Tests"

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/surefire-reports/*.xml"
            condition: always()

  # Stage 3: SAST — Security scanning (mandatory)
  - stage: SAST
    displayName: "Security Scan"
    dependsOn: Test
    jobs:
      - job: SecurityJob
        displayName: "Run SAST Tools"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          # Gitleaks — detect secrets and credentials
          - script: "gitleaks detect --source . --verbose"
            displayName: "Gitleaks — Secret Detection"
            continueOnError: true

          # Semgrep — static code analysis
          - script: "semgrep scan --config auto --json --output semgrep-report.json"
            displayName: "Semgrep — Code Analysis"
            continueOnError: true

          # Trivy — dependency and filesystem scan
          - script: "trivy fs . --format json --output trivy-report.json"
            displayName: "Trivy — Dependency & FS Scan"
            continueOnError: true

          # Publish SAST reports
          - task: PublishBuildArtifacts@1
            displayName: "Publish SAST Reports"
            inputs:
              pathToPublish: "."
              artifactName: "sast-reports"
            condition: always()

  # Stage 4: Publish — Publish build artifact
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: SAST
    jobs:
      - job: PublishJob
        displayName: "Publish Build Artifact"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: "Install Java JDK"
            inputs:
              versionSpec: "$(java_version)"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          - task: Cache@2
            displayName: "Cache Maven Dependencies"
            inputs:
              key: "maven | $(Agent.OS) | **/pom.xml"
              restoreKeys: |
                maven | $(Agent.OS)
                maven
              path: "$(maven_cache_folder)"

          - script: "mvn clean package -DskipTests --batch-mode"
            displayName: "Build Application"

          - task: PublishBuildArtifacts@1
            displayName: "Publish $(artifact_name)"
            inputs:
              pathToPublish: "target"
              artifactName: "$(artifact_name)"