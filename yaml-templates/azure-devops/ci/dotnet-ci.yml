---
# yaml-templates/azure-devops/ci/dotnet-ci.yml
# Purpose: Azure DevOps CI pipeline for .NET applications.
# Stages: Build → SAST → Publish

trigger:
  branches:
    include:
      - main

variables:
  build_configuration: "Release"
  dotnet_version: "8.x"
  project_name: "$(Build.Repository.Name)"

stages:
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        displayName: "Build .NET Application"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              version: "$(dotnet_version)"

          - script: "dotnet restore"
            displayName: "Restore Dependencies"

          - script: "dotnet build --configuration $(build_configuration) --no-restore"
            displayName: "Build Application"

          - script: "dotnet publish --configuration $(build_configuration) --no-build --output $(Build.ArtifactStagingDirectory)"
            displayName: "Publish Application"

  - stage: SAST
    displayName: "Security Scan"
    dependsOn: Build
    jobs:
      - job: SecurityJob
        displayName: "Run SAST Tools"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - script: "gitleaks detect --source . --verbose"
            displayName: "Run Gitleaks"
            continueOnError: true

          - script: "semgrep scan --config auto"
            displayName: "Run Semgrep"
            continueOnError: true

          - script: "trivy fs . --format table --severity HIGH,CRITICAL"
            displayName: "Run Trivy"
            continueOnError: true

  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: SAST
    jobs:
      - job: PublishJob
        displayName: "Publish Build Artifact"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UseDotNet@2
            displayName: "Install .NET SDK"
            inputs:
              version: "$(dotnet_version)"

          - script: "dotnet restore"
            displayName: "Restore Dependencies"

          - script: "dotnet publish --configuration $(build_configuration) --output $(Build.ArtifactStagingDirectory)"
            displayName: "Publish Application"

          - task: PublishBuildArtifacts@1
            displayName: "Publish $(project_name)-drop"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)"
              artifactName: "$(project_name)-drop"