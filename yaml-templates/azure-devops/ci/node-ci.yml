---
# yaml-templates/azure-devops/ci/node-ci.yml
# Purpose: Azure DevOps CI pipeline for Node.js applications.
# Stages: Build → SAST → Publish

trigger:
  branches:
    include:
      - main

variables:
  node_version: "20.x"
  project_name: "$(Build.Repository.Name)"

stages:
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        displayName: "Build Node.js Application"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: "$(node_version)"

          - script: "npm ci"
            displayName: "Install Dependencies"

          - script: "npm run build"
            displayName: "Build Application"

          - task: CopyFiles@2
            displayName: "Stage Build Output"
            inputs:
              sourceFolder: "."
              targetFolder: "$(Build.ArtifactStagingDirectory)"

  - stage: SAST
    displayName: "Security Scan"
    dependsOn: Build
    jobs:
      - job: SecurityJob
        displayName: "Run SAST Tools"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - script: "gitleaks detect --source . --verbose"
            displayName: "Run Gitleaks"
            continueOnError: true

          - script: "semgrep scan --config auto"
            displayName: "Run Semgrep"
            continueOnError: true

          - script: "trivy fs . --format table --severity HIGH,CRITICAL"
            displayName: "Run Trivy"
            continueOnError: true

  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: SAST
    jobs:
      - job: PublishJob
        displayName: "Publish Build Artifact"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: NodeTool@0
            displayName: "Install Node.js"
            inputs:
              versionSpec: "$(node_version)"

          - script: "npm ci"
            displayName: "Install Dependencies"

          - script: "npm run build"
            displayName: "Build Application"

          - task: PublishBuildArtifacts@1
            displayName: "Publish $(project_name)-drop"
            inputs:
              pathToPublish: "."
              artifactName: "$(project_name)-drop"