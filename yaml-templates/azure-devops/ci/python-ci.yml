---
# yaml-templates/azure-devops/ci/python-ci.yml
# Purpose: Azure DevOps CI pipeline for Python applications.
# Stages: Build → Test → SAST → Publish
# Tools: Gitleaks, Semgrep, Trivy for security scanning

trigger:
  branches:
    include:
      - main
      - develop

variables:
  python_version: "3.12"
  project_name: "$(Build.Repository.Name)"
  artifact_name: "$(project_name)-drop"

stages:
  # Stage 1: Build — Build Python application
  - stage: Build
    displayName: "Build Stage"
    jobs:
      - job: BuildJob
        displayName: "Build Python Application"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: "Install Python"
            inputs:
              versionSpec: "$(python_version)"

          - script: "pip install -r requirements.txt"
            displayName: "Install Dependencies"

          - script: >
              pip install build &&
              python -m build --outdir $(Build.ArtifactStagingDirectory)
            displayName: "Build Package"

  # Stage 2: Test — Run unit tests
  - stage: Test
    displayName: "Unit Testing"
    dependsOn: Build
    jobs:
      - job: TestJob
        displayName: "Run Unit Tests"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: "Install Python"
            inputs:
              versionSpec: "$(python_version)"

          - script: "pip install -r requirements.txt"
            displayName: "Install Dependencies"

          - script: "pytest --tb=short --junitxml=$(Agent.TempDirectory)/test-results.xml"
            displayName: "Run Unit Tests"

          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "$(Agent.TempDirectory)/test-results.xml"
            condition: always()

  # Stage 3: SAST — Security scanning (mandatory)
  - stage: SAST
    displayName: "Security Scan"
    dependsOn: Test
    jobs:
      - job: SecurityJob
        displayName: "Run SAST Tools"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          # Gitleaks — detect secrets and credentials
          - script: "gitleaks detect --source . --verbose"
            displayName: "Gitleaks — Secret Detection"
            continueOnError: true

          # Semgrep — static code analysis
          - script: "semgrep scan --config auto --json --output semgrep-report.json"
            displayName: "Semgrep — Code Analysis"
            continueOnError: true

          # Trivy — dependency and filesystem scan
          - script: "trivy fs . --format json --output trivy-report.json"
            displayName: "Trivy — Dependency & FS Scan"
            continueOnError: true

          # Publish SAST reports
          - task: PublishBuildArtifacts@1
            displayName: "Publish SAST Reports"
            inputs:
              pathToPublish: "."
              artifactName: "sast-reports"
            condition: always()

  # Stage 4: Publish — Publish build artifact
  - stage: Publish
    displayName: "Publish Artifact"
    dependsOn: SAST
    jobs:
      - job: PublishJob
        displayName: "Publish Build Artifact"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: "Install Python"
            inputs:
              versionSpec: "$(python_version)"

          - script: "pip install -r requirements.txt"
            displayName: "Install Dependencies"

          - script: >
              pip install build &&
              python -m build --outdir $(Build.ArtifactStagingDirectory)
            displayName: "Build Package"

          - task: PublishBuildArtifacts@1
            displayName: "Publish $(artifact_name)"
            inputs:
              pathToPublish: "$(Build.ArtifactStagingDirectory)"
              artifactName: "$(artifact_name)"